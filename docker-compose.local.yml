# ─────────────────────────────────────────────────────────────────────────────
# vado bene? — ambiente locale Docker (app + sidecar cron)
#
# Uso:
#   docker compose -f docker-compose.local.yml up --build
#   docker compose -f docker-compose.local.yml logs -f app
#   docker compose -f docker-compose.local.yml down
#
# Richiede un file .env.local (copia da .env.example e riempi i valori).
# Niente Postgres locale: il DB è Supabase remoto.
#
# Il sidecar `cron` replica Vercel Cron chiamando le route /api/cron/*:
# qui il giurì a 3 minuti gira davvero (close-juries ogni minuto — Vercel
# Hobby limita i cron a max 1/ora, vedi DEPLOY.md).
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Sidecar cron: crond che chiama le route cron come farebbe Vercel Cron.
  # busybox crond NON passa le env del container ai job: "$$CRON_SECRET" lasciata
  # nel crontab resterebbe letterale (o vuota) → 401 a ogni esecuzione. Fix: il
  # crontab viene SCRITTO a startup dall'entrypoint sh, che ha le env (env_file):
  # i doppi apici fanno espandere la secret nel file, dove crond la trova già
  # risolta. Auth via header Authorization (la secret in ?secret= finisce nei log).
  # $$ = $ letterale in compose; $CRON_SECRET viene espanso da sh dentro il container.
  # Log su /var/log/cron.log — `docker compose -f docker-compose.local.yml exec cron cat /var/log/cron.log`
  cron:
    image: alpine:3.20
    env_file:
      - .env.local
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        {
          echo "* * * * * wget -q -O- --header=\"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/close-juries >> /var/log/cron.log 2>&1"
          echo "0 * * * * wget -q -O- --header=\"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/expire-photos >> /var/log/cron.log 2>&1"
        } > /etc/crontabs/root
        chmod 600 /etc/crontabs/root
        crond -f -l 2
    restart: unless-stopped
