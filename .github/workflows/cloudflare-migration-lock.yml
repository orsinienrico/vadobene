name: Cloudflare migration dependency lockfile

on:
  push:
    branches: [cloudflare/migration]
    paths:
      - package.json
      - .github/workflows/cloudflare-migration-lock.yml

permissions:
  contents: write

jobs:
  resolve:
    if: github.repository == 'orsinienrico/vadobene' && github.ref == 'refs/heads/cloudflare/migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lockfile-only, no install scripts or deployment credentials.
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit reviewed dependency resolution to migration branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: refresh Cloudflare migration dependency lockfile"
          git push origin HEAD:cloudflare/migration
