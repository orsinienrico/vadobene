name: Beta credential availability (read-only)
on:
  push:
    branches: [beta/invite-only-onboarding]
    paths: ['.github/workflows/beta-credential-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-check:
    if: github.repository == 'orsinienrico/vadobene' && github.ref == 'refs/heads/beta/invite-only-onboarding'
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only (never print values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        shell: bash
        run: |
          set -eu
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY ANTHROPIC_API_KEY RESEND_API_KEY; do
            if [[ -n "${!name}" ]]; then
              printf '%s: configured\n' "$name"
            else
              printf '%s: unavailable\n' "$name"
            fi
          done
