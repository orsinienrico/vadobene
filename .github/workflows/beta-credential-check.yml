name: Beta credential availability (read-only)
on:
  push:
    branches: [beta/invite-only-onboarding]
    paths: ['.github/workflows/beta-credential-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-check:
    if: github.repository == 'orsinienrico/vadobene' && github.ref == 'refs/heads/beta/invite-only-onboarding'
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only (never print values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        shell: bash
        run: |
          set -eu
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY ANTHROPIC_API_KEY RESEND_API_KEY; do
            if [[ -n "${!name}" ]]; then
              printf '%s: configured\n' "$name"
            else
              printf '%s: unavailable\n' "$name"
            fi
          done

      - name: Verify access to VadoBene Worker (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -eu
          : "${CLOUDFLARE_API_TOKEN:?Cloudflare token unavailable}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Cloudflare account ID unavailable}"
          code=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vadobene/settings")
          printf 'VadoBene Worker settings HTTP status: %s\n' "$code"
          test "$code" = 200

      - name: Inventory current VadoBene deployment and binding names (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/vadobene"
          for endpoint in deployments settings subdomain; do
            status=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/vb-$endpoint.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$endpoint")
            echo "$endpoint HTTP $status"
            if [ "$status" = 200 ]; then
              case "$endpoint" in
                deployments) jq -c '.result | {deployments: [.deployments[]? | {id,created_on,versions: [.versions[]? | {version_id,percentage}]}]}' "$RUNNER_TEMP/vb-$endpoint.json";;
                settings) jq -c '.result | {bindings: [.bindings[]? | {name,type}]}' "$RUNNER_TEMP/vb-$endpoint.json";;
                subdomain) jq -c '.result | {enabled,previews_enabled}' "$RUNNER_TEMP/vb-$endpoint.json";;
              esac
            fi
          done
          rm -f "$RUNNER_TEMP"/vb-*.json
          for route in / /api/health; do
            status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://vadobene.casabearpisa.workers.dev$route")
            echo "Public $route HTTP $status"
          done
