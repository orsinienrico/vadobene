name: Cloudflare Workers compatibility (no deployment)

on:
  pull_request:
    paths:
      - src/**
      - public/**
      - open-next.config.ts
      - custom-worker.ts
      - wrangler.jsonc
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/cloudflare-compatibility.yml

permissions:
  contents: read

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Next.js as Cloudflare Worker (no credentials)
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          LAUNCH_ENABLED: "false"
          SCHEDULER_ENABLED: "false"
          SCHEDULER_CONFIRMED: "false"
      - name: Validate Worker bundle without publishing
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/vadobene-worker
