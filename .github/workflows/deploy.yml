# ─────────────────────────────────────────────────────────────────────────────
# Deploy in produzione — solo push su master (o trigger manuale).
#
# ① vercel — build prebuilt (`vercel build`) + deploy --prod via CLI
# ② docker — build + push immagine su GHCR (ghcr.io/<owner>/<repo>)
#
# SETUP UNA TANTUM (vedi DEPLOY.md per il walkthrough completo):
#   1. Vercel: `npx vercel login` poi `npx vercel link` dalla root del repo
#      (crea .vercel/project.json — NON committarlo).
#   2. Secrets GitHub (Settings → Secrets and variables → Actions):
#      - VERCEL_TOKEN        → Vercel → Settings → Tokens
#      - VERCEL_ORG_ID       → .vercel/project.json → "orgId" (o Vercel → Settings → General)
#      - VERCEL_PROJECT_ID   → .vercel/project.json → "projectId"
#      - NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY
#      - NEXT_PUBLIC_POSTHOG_KEY / NEXT_PUBLIC_POSTHOG_HOST / NEXT_PUBLIC_SITE_URL
#      Le variabili server-side (ANTHROPIC_API_KEY, SUPABASE_SERVICE_ROLE_KEY,
#      STRIPE_*, RESEND_*, CRON_SECRET) NON servono qui: le prende Vercel dalle
#      sue Environment Variables (dashboard) a runtime.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  vercel:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      # La versione pnpm arriva dal campo packageManager di package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Pull dell'ambiente di produzione Vercel (incluse le NEXT_PUBLIC_*
      # configurate sulla dashboard) — serve per il build prebuilt.
      - name: Pull Vercel environment (production)
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (prebuilt)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Migrazione DB PRIMA del deploy del codice che usa le RPC (claim_jury_close,
      # spend_jury_credit, ...): lo schema non deve mai restare indietro rispetto
      # al codice appena deployato. Tutte le migration in ordine di nome — non
      # `pnpm db:migrate` (copre solo 0001, le RPC sono in 0002). psql senza
      # ON_ERROR_STOP: rieseguendo migration non idempotenti su DB già migrato
      # logga gli errori di duplicati e prosegue (exit 0); su un progetto nuovo
      # applica tutto.
      - name: Migrate DB (prima del deploy)
        run: |
          for f in supabase/migrations/*.sql; do
            echo "── $f"
            psql "$SUPABASE_DB_URL" -f "$f"
          done
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # URL del deployment catturato dall'output del CLI (niente awk su `vercel
      # ls`, fragile): l'ultimo URL stampato è il deploy di produzione appena fatto.
      - name: Deploy (production)
        id: deploy
        run: |
          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tee /tmp/deploy.out
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+' /tmp/deploy.out | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Post-deploy verification (come Autopilot): l'app risponde davvero.
      # Attende il propagation del deploy prima del primo curl.
      - name: Post-deploy check (/api/health)
        run: |
          sleep 30
          curl -fsS --retry 5 --retry-delay 10 "${{ steps.deploy.outputs.url }}/api/health"

  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le NEXT_PUBLIC_* sono inlineate nel bundle a build time: senza questi
      # build-args il client parte senza Supabase/PostHog. MAI i secret
      # server-side come build args (resterebbero nell'immagine).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
